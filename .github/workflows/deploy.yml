name: Deploy to montecarlovalet.com
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1. Sanity check: every module must parse
      - name: Syntax + module list check
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          npm i --no-save --silent acorn@8
          node tools/check_modules.js
          node tools/check_i18n.js
      # 2. Stage only what the site needs (no docs/spec/art)
      - name: Stage site
        run: |
          mkdir site
          cp -r index.html sw.js manifest.webmanifest icons fonts js site/
          echo "www.montecarlovalet.com" > site/CNAME
          printf '# montecarlovalet.com\nDeployed automatically from iamabotama/Montecarlovalet. Do not edit here.\n' > site/README.md
      # 3. Push to the Pages repo (plain git: no Docker image to download, so no Docker Hub rate limits)
      - name: Push to iamabotama/Montecarlovalet.com
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${DEPLOY_TOKEN}@github.com/iamabotama/Montecarlovalet.com.git" dest
          find dest -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r site/. dest/
          cd dest
          git config user.name "Monte Carlo Valet CI"
          git config user.email actions@github.com
          git add -A
          if git diff --cached --quiet; then echo "Nothing to deploy"; exit 0; fi
          git commit -qm "Deploy: ${GITHUB_SHA}"
          git push origin HEAD:main
